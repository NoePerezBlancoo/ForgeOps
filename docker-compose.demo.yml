name: forgeops-demo

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-forgeops}
      POSTGRES_USER: ${POSTGRES_USER:-forgeops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - forgeops_demo_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-forgeops} -d ${POSTGRES_DB:-forgeops}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:8.2-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - forgeops_demo_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment: &backend-environment
      APP_ENV: ${APP_ENV:-staging}
      APP_VERSION: ${APP_VERSION:-1.2.2}
      BUILD_COMMIT: ${BUILD_COMMIT:-manual-demo}
      SEED_DEMO_DATA: "false"
      ALLOW_DEMO_SEED: "false"
      RUN_MIGRATIONS: "true"
      RUN_RUNTIME_ROLE_SETUP: "true"
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-forgeops}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-forgeops}
      DATABASE_POOL_MODE: direct
      DATABASE_RUNTIME_ROLE: forgeops_runtime
      REDIS_URL: redis://redis:6379/0
      REDIS_REQUIRED: "true"
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      FRONTEND_URL: https://${DEMO_DOMAIN:?DEMO_DOMAIN is required}
      API_URL: https://${DEMO_DOMAIN}
      CONTROL_URL: https://${DEMO_DOMAIN}/control
      CORS_ORIGINS: https://${DEMO_DOMAIN}
      COOKIE_SECURE: "true"
      STORAGE_BACKEND: local
      UPLOAD_DIRECTORY: /app/uploads
      EMAIL_BACKEND: development
      TRIAL_DAYS: ${TRIAL_DAYS:-30}
      TRIAL_SIGNUP_ENABLED: ${TRIAL_SIGNUP_ENABLED:-true}
      AI_PROVIDER: ${AI_PROVIDER:-local}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
    volumes:
      - forgeops_demo_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  worker:
    build:
      context: ./backend
    entrypoint: ["python", "-m", "app.jobs.worker"]
    environment: *backend-environment
    volumes:
      - forgeops_demo_uploads:/app/uploads
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from app.core.redis import get_queue_redis; assert get_queue_redis().ping()"]
      interval: 15s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: /api/v1
        NEXT_PUBLIC_SALES_EMAIL: ${NEXT_PUBLIC_SALES_EMAIL:?NEXT_PUBLIC_SALES_EMAIL is required}
        NEXT_PUBLIC_DEMO_CREDENTIALS: "false"
        NEXT_PUBLIC_APP_VERSION: ${APP_VERSION:-1.2.2}
        NEXT_PUBLIC_BUILD_COMMIT: ${BUILD_COMMIT:-manual-demo}
        NEXT_PUBLIC_ENVIRONMENT: ${APP_ENV:-staging}
        NEXT_PUBLIC_PWA_ENABLED: "true"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r => { if (!r.ok) process.exit(1) })"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    environment:
      DEMO_DOMAIN: ${DEMO_DOMAIN:?DEMO_DOMAIN is required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  forgeops_demo_postgres:
  forgeops_demo_redis:
  forgeops_demo_uploads:
  caddy_data:
  caddy_config:
