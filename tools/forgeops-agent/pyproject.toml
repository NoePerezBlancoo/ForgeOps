[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "forgeops-local-agent"
version = "1.0.0"
description = "Local AI development orchestrator for ForgeOps"
requires-python = ">=3.12"
dependencies = [
  "psutil==7.2.2",
  "PyYAML==6.0.3",
]

[project.optional-dependencies]
test = [
  "pytest==9.1.1",
  "ruff==0.15.5",
]

[project.scripts]
forgeops-agent = "forgeops_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
