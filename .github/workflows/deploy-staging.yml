name: Deploy staging

on:
  workflow_run:
    workflows: ["Quality gate"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: railway-staging
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      vars.RAILWAY_STAGING_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Resolve release identity
        shell: bash
        run: |
          echo "EXPECTED_VERSION=$(node -p "require('./frontend/package.json').version")" >> "$GITHUB_ENV"
          echo "EXPECTED_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - run: npm install --global @railway/cli@5.37.7
      - name: Deploy backend
        run: railway up --service backend --environment staging --ci
      - name: Deploy worker
        run: railway up --service worker --environment staging --ci
      - name: Deploy frontend
        run: railway up --service frontend --environment staging --ci
      - name: Validate staging
        env:
          RELEASE_API_URL: ${{ vars.STAGING_API_URL }}
          RELEASE_APP_URL: ${{ vars.STAGING_APP_URL }}
          EXPECTED_ENVIRONMENT: staging
        run: python backend/scripts/validate_release.py
