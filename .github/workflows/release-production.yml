name: Release production

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version already validated in staging
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: railway-production
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.identity.outputs.commit }}
    steps:
      - name: Validate version input
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must use X.Y.Z format" >&2
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: v${{ inputs.version }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Verify tag and application metadata
        id: identity
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          test "$(git describe --tags --exact-match)" = "v$RELEASE_VERSION"
          test "$(node -p "require('./frontend/package.json').version")" = "$RELEASE_VERSION"
          grep --fixed-strings --quiet "app_version: str = \"$RELEASE_VERSION\"" backend/app/core/config.py
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  deploy:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ inputs.version }}
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: npm install --global @railway/cli@5.37.7
      - name: Deploy backend
        run: railway up --service backend --environment production --ci
      - name: Deploy worker
        run: railway up --service worker --environment production --ci
      - name: Deploy frontend
        run: railway up --service frontend --environment production --ci
      - name: Validate production
        env:
          RELEASE_API_URL: ${{ vars.PRODUCTION_API_URL }}
          RELEASE_APP_URL: ${{ vars.PRODUCTION_APP_URL }}
          EXPECTED_VERSION: ${{ inputs.version }}
          EXPECTED_ENVIRONMENT: production
          EXPECTED_COMMIT: ${{ needs.preflight.outputs.commit }}
        run: python backend/scripts/validate_release.py
