name: Quality gate

on:
  push:
    branches: [main, "feature/**", "codex/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: forgeops_test
          POSTGRES_USER: forgeops
          POSTGRES_PASSWORD: forgeops-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forgeops -d forgeops_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:8.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      APP_ENV: testing
      SECRET_KEY: ci-test-key-with-at-least-thirty-two-characters
      DATABASE_URL: postgresql+psycopg://forgeops:forgeops-ci-only@localhost:5432/forgeops_test
      TEST_DATABASE_URL: postgresql+psycopg://forgeops:forgeops-ci-only@localhost:5432/forgeops_test
      DATABASE_RUNTIME_ROLE: forgeops_runtime
      REDIS_URL: redis://localhost:6379/0
      REDIS_REQUIRED: "true"
      JOB_DISPATCH_ENABLED: "false"
      TEST_WORKER_INTEGRATION: "true"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check app scripts tests alembic
      - run: alembic upgrade head
      - run: python -m scripts.ensure_runtime_role
      - run: python -m scripts.check_migrations
      - run: alembic check
      - run: pytest --ignore=tests/test_postgres_rls.py --cov=app --cov-report=term-missing --cov-fail-under=70
      - run: pytest tests/test_postgres_rls.py -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: backend/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm audit --omit=dev --audit-level=high
        working-directory: frontend

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose config --quiet
      - run: docker compose build backend worker frontend
